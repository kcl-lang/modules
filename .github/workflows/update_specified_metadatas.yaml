name: Republish Specified Packages

on:
  workflow_dispatch:
    inputs:
      myInput:
        description: 'Enter the package path'
        required: true
        default: ''

env:
  KPM_REG: "ghcr.io"
  KPM_REPO: "kcl-lang"

# Same group as the "Publish Package" workflow: both commit regenerated
# artifacthub-pkg.yaml files back to main and must not race on `git push`.
concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  publish_pkg:
    # NOTE:
    # - This is limited to pull_request* events and would raise an error for other events.
    # - A maximum of 3000 files can be returned.
    # - For more flexibility and no limitations see "Using local .git history" above.

    runs-on: ubuntu-latest
    name: Update Package Info on AH
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.21

      - name: Install kpm
        run: go install kcl-lang.io/kpm@latest

      # Authenticate to ghcr.io via the standard Docker credential helper
      # chain (`docker/login-action`). kpm's credential store falls back to
      # `~/.docker/config.json` when its own `~/.kpm/config/config.json`
      # returns empty, so this populates the fallback store correctly on
      # GitHub Actions runners that ship a credential helper that blocks
      # plaintext storage.
      #
      # ghcr.io/kcl-lang is the only registry we publish to — see the
      # "Publish Package" workflow for why the docker.io/kcllang mirror was
      # dropped.
      #
      # `kpm login` cannot be used here because the underlying ORAS store
      # requires `AllowPlaintextPut: true`, which is only enabled when
      # `OCI_REG_PLAIN_HTTP=on` is set — and that flag also forces the
      # registry to plain HTTP, which breaks HTTPS-only registries like
      # ghcr.io. See issue #378.
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.DEPLOY_ACCESS_NAME }}
          password: ${{ secrets.DEPLOY_ACCESS_TOKEN }}

      # Capture the actual push outcome via a step output instead of
      # `continue-on-error` + `steps.<id>.conclusion`. With
      # `continue-on-error: true`, the step's `conclusion` is always
      # `success` regardless of the underlying script's exit code, so
      # the verify step below would never trip — exactly the bug
      # behind issue #395.
      - name: Republish to ghcr.io
        id: publish-ghcr
        if: github.event.inputs.myInput != ''
        run: |
          ghcr_ok="true"
          while IFS= read -r -d '' modfile; do
            dir=$(dirname "$modfile")
            echo "Pushing in directory: $dir"
            if ! (cd "$dir" && kpm push); then
              echo "::warning::ghcr.io push failed in $dir"
              ghcr_ok="false"
            fi
          done < <(find "${{ github.event.inputs.myInput }}" -name "kcl.mod" -print0)
          echo "ghcr_ok=$ghcr_ok" >> "$GITHUB_OUTPUT"

      # Hardening (issue #378: keep Artifact Hub in sync with the
      # registry). If the publish failed, do not refresh Artifact Hub for
      # a module that does not actually exist in the registry.
      - name: Verify publish succeeded
        if: always()
        run: |
          ghcr_ok="${{ steps.publish-ghcr.outputs.ghcr_ok }}"
          if [[ "$ghcr_ok" == "true" ]]; then
            echo "ghcr.io publish succeeded."
          else
            echo "::error::ghcr.io publish failed. Aborting to keep Artifact Hub in sync with the registry."
            exit 1
          fi

      # Inherits KPM_REG/KPM_REPO from the workflow env above, so the OCI
      # manifest main.go reads back is the one this run just pushed.
      - name: Regenerate artifacthub-pkg.yaml
        if: always()
        run: |
          find ${{ github.event.inputs.myInput }} -name "kcl.mod" -exec bash -c 'file="{}" && echo Running for file: "$file" && go run main.go "$file" || echo Failed to run for file: "$file"' \;

      - name: Commit and push changes
        if: always()
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'

          git add .
          git commit -m "Regenerate artifacthub-pkg.yaml for all packages" || echo "Nothing to commit"

          # main may have moved since checkout (see the "Publish Package"
          # workflow) — rebase before pushing or the push is rejected
          # with "fetch first" and the commit is lost (issue #395).
          git pull --rebase origin main
          git push
