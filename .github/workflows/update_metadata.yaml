name: Publish Package

on:
  push:
    branches:
      - main
    paths:
      - "**.mod"

env:
  KPM_REG: "ghcr.io"
  KPM_REPO: "kcl-lang"

# Serialize publish runs. When several PRs touching *.mod merge in quick
# succession, each push triggers a run, and every run commits its
# artifacthub-pkg.yaml changes back to main. Without this group the runs
# race on `git push` and every one of them gets rejected with
# "! [rejected] main -> main (fetch first)" — the metadata commits are
# then silently lost and Artifact Hub never learns about the new versions
# (see issue #395). cancel-in-progress is false on purpose: a cancelled
# run would skip the very publish it was created for.
concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  publish_pkg:
    # NOTE:
    # - This is limited to pull_request* events and would raise an error for other events.
    # - A maximum of 3000 files can be returned.
    # - For more flexibility and no limitations see "Using local .git history" above.

    runs-on: ubuntu-latest
    name: Update Package Info on AH
    steps:

      - name: Install kcl
        run: wget -q https://kcl-lang.io/script/install-cli.sh -O - | /bin/bash

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # ghcr.io/kcl-lang is the only registry we publish to. It is also
      # kpm's default registry, so a module published here is the one
      # `kcl mod add` resolves without any registry override. The former
      # docker.io/kcllang mirror is no longer pushed: the org-level
      # DOCKER_USERNAME/DOCKER_PASSWORD stopped being accepted by Docker
      # Hub, and a silently dead mirror is worse than none — the metadata
      # step below reads the OCI manifest back from the registry it
      # published to, so a failed mirror used to take the whole job down
      # with `docker.io/kcllang/<pkg>:<ver>: not found`.
      #
      # Write credentials into BOTH:
      #   * `~/.docker/config.json` (the file ORAS reads by default)
      #   * `~/.kpm/config/config.json` (the file kpm's own store reads)
      #
      # Writing only to `~/.kpm/config/config.json` is not enough: ORAS
      # does not consult it, so the push fell back to anonymous auth and
      # got 401/403, while the `continue-on-error: true` on the publish
      # step masked the failure as `conclusion=success`. That is the root
      # cause of issue #395 ("no packages since end of July were
      # published").
      #
      # `kcl registry login` cannot be used here because the underlying
      # ORAS store requires `AllowPlaintextPut: true`, which is only
      # enabled when `OCI_REG_PLAIN_HTTP=on` is set — and that flag also
      # forces the registry to plain HTTP, which breaks HTTPS-only
      # registries like ghcr.io. See issue #378.
      #
      # ORAS's credential lookup uses the hostname as the key (e.g.
      # `ghcr.io`) and matches it against the auths map.
      - name: Configure registry credentials
        run: |
          mkdir -p "$HOME/.docker" "$HOME/.kpm/config"
          GHCR_AUTH=$(printf '%s:%s' "${{ secrets.DEPLOY_ACCESS_NAME }}" "${{ secrets.DEPLOY_ACCESS_TOKEN }}" | base64 -w0)

          # ORAS reads this.
          cat > "$HOME/.docker/config.json" <<EOF
          {
            "auths": {
              "ghcr.io": { "auth": "${GHCR_AUTH}" }
            }
          }
          EOF

          # kpm's own store reads this. Mirror of the above so any code
          # path that consults kpm's store first still finds the creds.
          cp "$HOME/.docker/config.json" "$HOME/.kpm/config/config.json"

          echo "Wrote credentials to $HOME/.docker/config.json and $HOME/.kpm/config/config.json"
          cat "$HOME/.docker/config.json" | sed 's/"auth": "[^"]*"/"auth": "<redacted>"/'

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41

      # Capture the actual push outcome via a step output instead of
      # `continue-on-error` + `steps.<id>.conclusion`. With
      # `continue-on-error: true`, the step's `conclusion` is always
      # `success` regardless of the underlying script's exit code, so
      # the verify step below would never trip — exactly the bug
      # behind issue #395.
      - name: Publish to ghcr.io
        id: publish-ghcr
        if: steps.changed-files.outputs.all_changed_files != ''
        run: |
          ghcr_ok="false"
          if echo "${{ steps.changed-files.outputs.all_changed_files }}" | grep -q 'kcl.mod'; then
            for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
              if ./scripts/push_pkg_from.sh "$file"; then
                ghcr_ok="true"
              else
                echo "::warning::ghcr.io push failed for $file (see log above)"
              fi
            done
          fi
          echo "ghcr_ok=$ghcr_ok" >> "$GITHUB_OUTPUT"

      # Hardening (issue #378: keep Artifact Hub in sync with the
      # registry). If the publish failed for the changed kcl.mod files,
      # fail the job so the resulting artifacthub-pkg.yaml changes are
      # not committed and Artifact Hub is not refreshed for a module that
      # does not actually exist in the registry.
      - name: Verify publish succeeded
        if: always()
        run: |
          ghcr_ok="${{ steps.publish-ghcr.outputs.ghcr_ok }}"
          if [[ "$ghcr_ok" == "true" ]]; then
            echo "ghcr.io publish succeeded."
          else
            echo "::error::ghcr.io publish failed. Aborting to keep Artifact Hub in sync with the registry."
            exit 1
          fi

      # Inherits KPM_REG/KPM_REPO from the workflow env above, so the OCI
      # manifest main.go reads back is the one this run just pushed.
      - name: Update artifacthub-pkg.yaml
        if: always()
        run: |
          if echo "${{ steps.changed-files.outputs.all_changed_files }}" | grep -q 'kcl.mod'; then
            for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
              if [[ "$file" == *.go ]]; then
                continue
              fi
              go run main.go $file
            done
          fi

      - name: Commit and push changes
        if: always()
        run: |
          if echo "${{ steps.changed-files.outputs.all_changed_files }}" | grep -q 'kcl.mod'; then
            git config --global user.name 'GitHub Action'
            git config --global user.email 'action@github.com'

            git add .
            git commit -m "chore: update artifacthub-pkg.yaml" || echo "Nothing to commit"

            # main may have moved since checkout (e.g. a previous publish
            # run in the same concurrency group already pushed its metadata
            # commit, or another workflow pushed). Rebase our metadata
            # commit on top before pushing, otherwise the push is rejected
            # with "fetch first" and the commit is lost (issue #395).
            git pull --rebase origin main
            git push
          fi
